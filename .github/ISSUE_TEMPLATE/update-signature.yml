name: Update my signature
description: Your details changed, or your photo needs replacing.
title: "Signature update: "
labels: ["signature", "update"]
body:
  - type: markdown
    attributes:
      value: |
        Tell us what changed. Only fill in the fields that are different - the
        rest stay as they are.

  - type: input
    id: person_id
    attributes:
      label: Your page
      description: >-
        The last part of your signature URL, or just your name if you are not
        sure.
      placeholder: mai-tran
    validations:
      required: true

  - type: textarea
    id: changes
    attributes:
      label: What is changing
      description: One per line. Leave out anything staying the same.
      placeholder: |
        role: Senior Software Engineer
        phone: (+84) 987 654 321
      render: text
    validations:
      required: true

  - type: textarea
    id: photo
    attributes:
      label: New photo
      description: >-
        Only if you are replacing it. Drag the file into this box.
    validations:
      required: false

  - type: dropdown
    id: style
    attributes:
      label: Which style?
      description: >-
        All ten carry exactly the same details - only the arrangement changes.
        You can see them side by side on your page afterwards and switch any
        time; this just sets which one your page ships with. Leave it if you
        do not mind.
      options:
        - "classic - Classic: Photo left, ochre rule. The house default."
        - "plate - Plate: Name reversed out of an umber block."
        - "cap - Cap: Company across the top, you underneath."
        - "footer - Footer: Brand bar along the bottom."
        - "sidebar - Sidebar: Photo and logo stacked in a colour column."
        - "compact - Compact: The smallest block that still says everything."
        - "stacked - Stacked: No photo. Logo leads."
        - "banner - Banner: Ruled top and bottom, like a printed card."
        - "badge - Badge: Logo in a colour square. No photo."
      default: 0
    validations:
      required: false
  - type: checkboxes
    id: removal
    attributes:
      label: Removing something
      options:
        - label: >-
            I want a row removed entirely (say which one above - for example
            drop the phone number).
          required: false
