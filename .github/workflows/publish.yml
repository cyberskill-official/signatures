name: Publish

# Rebuilds docs/ after anything lands on main and deploys it, so contributors
# never run the build themselves.
#
# Why this deploys an artifact instead of relying on the branch:
#
#   A push made with GITHUB_TOKEN does not trigger any workflow, and that
#   includes GitHub's own pages-build-deployment. With Pages set to "deploy
#   from a branch", this job would commit docs/ and the live site would never
#   update - a silent failure that looks like success in the Actions log.
#   Uploading the built tree and calling deploy-pages publishes directly, so
#   the deploy is part of this run and shows up in it.
#
# REQUIRES: Settings -> Pages -> Source = "GitHub Actions".
# The custom domain is stored in repository settings, not in docs/CNAME, so
# switching the source keeps signature.cyberskill.world and its certificate.
# docs/CNAME is still generated and committed; Pages ignores it under this
# source, and it keeps the branch-deploy fallback intact.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "build/**"
      - "install.sh"
  workflow_dispatch:

permissions:
  contents: write   # commit the rebuilt docs/
  pages: write      # deploy it
  id-token: write   # OIDC, required by deploy-pages

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: pip install -r requirements.txt

      # The publish path used to deploy without validating anything. Whatever
      # reached main by any route other than a passing pull request went
      # straight to production - a direct push, an admin merge, a manual
      # workflow_dispatch. These run here too.
      - name: Unit tests
        run: python3 -m pytest tests/ -q

      - name: Install browser
        run: python -m playwright install --with-deps chromium

      # --skip-icons: icon rasterisation goes through a headless browser and is
      # not byte-identical across versions, so rebuilding here would produce a
      # spurious diff. Avatars still rebuild - Pillow is deterministic.
      - name: Rebuild site
        run: ./install.sh --skip-icons

      # Chromium only. The full three-engine matrix stays on the pull request
      # path where a human is waiting; this is the last gate before the live
      # site, so it checks layout, contrast and blocked images and moves on.
      - name: Render checks
        run: python3 validation/check.py

      # Committing is for the record and for the branch-deploy fallback. The
      # deploy below is what actually publishes, so a failure to commit must
      # not stop the site updating.
      - name: Commit if anything changed
        run: |
          if git diff --quiet -- docs/; then
            echo "docs/ already current - nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          git commit -m "Rebuild docs/ from ${GITHUB_SHA::7}"
          git push

      - name: Package the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: docs

      - name: Deploy to Pages
        id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0

      - name: Where it went
        run: |
          echo "Deployed: ${{ steps.deploy.outputs.page_url }}"
          echo "Give it a moment, then: ./install.sh --verify-remote"
