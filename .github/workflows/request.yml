name: Request to pull request

# Turns a signature request issue into a branch, a record, a photo and a pull
# request. The existing validation then checks it like any other contribution.
#
# Without this, the issue forms collect structured data and a maintainer
# retypes it as YAML - the bottleneck the forms were meant to remove, moved
# one step later.

on:
  issues:
    types: [opened, edited, labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: request-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  # A separate job that ALWAYS runs, so the decision is visible.
  #
  # This was originally a job-level `if:` on author_association. That silently
  # skipped the whole workflow, which is indistinguishable from a workflow
  # that is broken - and it rejected the repository owner, because
  # author_association only reports MEMBER when organisation membership is
  # public. Private membership reports CONTRIBUTOR or NONE.
  #
  # Ask for the actual permission instead, and log what was decided either
  # way. The gate still matters: this repository is public, so without it
  # anyone with a GitHub account could make a workflow holding contents:write
  # create branches on demand.
  gate:
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          USER_LOGIN: ${{ github.event.issue.user.login }}
          ASSOC: ${{ github.event.issue.author_association }}
          LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
        run: |
          echo "author:      $USER_LOGIN"
          echo "association: $ASSOC"
          echo "labels:      ${LABELS:-<none>}"

          if [[ ",$LABELS," != *",signature,"* ]]; then
            echo "::notice::Not a signature request - no 'signature' label. Nothing to do."
            echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
          fi

          perm=$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${USER_LOGIN}/permission" \
                   --jq .permission 2>/dev/null || echo unknown)
          echo "permission:  $perm"

          # Fall back to author_association if the permission API is not
          # readable, so a token-scope change degrades to the old behaviour
          # rather than blocking everyone.
          if [[ "$perm" == "admin" || "$perm" == "maintain" || "$perm" == "write" ]] \
             || [[ "$ASSOC" == "OWNER" || "$ASSOC" == "MEMBER" || "$ASSOC" == "COLLABORATOR" ]]; then
            echo "::notice::$USER_LOGIN has write access - building the request."
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$USER_LOGIN has '$perm' permission and association '$ASSOC'. Not building. Ask a maintainer to raise this one."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: gate
    if: needs.gate.outputs.ok == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: pip install -r requirements.txt

      - name: Which form was used
        id: mode
        run: |
          if [ "${{ contains(github.event.issue.labels.*.name, 'update') }}" = "true" ]; then
            echo "mode=update" >> "$GITHUB_OUTPUT"
          else
            echo "mode=new" >> "$GITHUB_OUTPUT"
          fi

      # The issue body is untrusted input. It reaches the script through a
      # file, never through a shell interpolation - ${{ github.event.issue.body }}
      # inline in a run: block is a shell injection waiting to happen.
      - name: Save the issue
        env:
          ISSUE: ${{ toJSON(github.event.issue) }}
        run: printf '%s' "$ISSUE" > /tmp/issue.json

      - name: Build the record
        id: record
        run: python3 .github/scripts/issue_to_record.py /tmp/issue.json ${{ steps.mode.outputs.mode }}

      - name: Rebuild the site
        run: ./install.sh --skip-icons

      # Full validation runs HERE, before the pull request exists.
      #
      # A pull request opened with GITHUB_TOKEN does not trigger workflows, so
      # Validate sits at "1 workflow awaiting approval" until a maintainer
      # clicks it - which means the automation would hand over an unchecked
      # pull request and ask for a click before the checks even start. Running
      # the checks here inverts that: the pull request arrives already
      # verified, and approving Validate afterwards is a second opinion rather
      # than the only one.
      - name: Unit tests
        run: python3 -m pytest tests/ -q

      - name: Install browser
        run: python -m playwright install --with-deps chromium

      - name: Render and accessibility checks
        run: python3 validation/check.py

      - name: Cross-client checks
        run: |
          python3 validation/crossclient.py \
            --engines chromium --require-engines chromium

      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: request-${{ github.event.issue.number }}-evidence
          path: |
            validation/screenshots/
            validation/report.json
            validation/crossclient/report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Open the pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          ID: ${{ steps.record.outputs.id }}
          NAME: ${{ steps.record.outputs.name }}
          NUM: ${{ github.event.issue.number }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          branch="request/${NUM}-${ID}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add src/ docs/
          if git diff --cached --quiet; then
            echo "Nothing changed - the request matches what is already there."
            exit 0
          fi
          git commit -m "${MODE^} signature for ${NAME} (#${NUM})"
          git push -f origin "$branch"

          existing=$(gh pr list --head "$branch" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            echo "Updated existing PR #$existing"
            echo "pr=$existing" >> "$GITHUB_OUTPUT"
          else
            # Built line by line into a file. A multi-line --body string
            # inside a YAML block scalar has to stay indented, and an
            # unindented line silently ends the block - which is how this
            # workflow broke once already.
            printf '%s\n' \
              "Generated from #${NUM}. Closes #${NUM}." \
              "" \
              "Unit tests, render checks and cross-client checks all passed" \
              "before this was opened - see the \`Request to pull request\`" \
              "run. Screenshots are attached to it as an artifact." \
              "" \
              "A human still needs to check what a test cannot:" \
              "" \
              "- the name is spelled and accented the way they wrote it" \
              "- the photo is cropped sensibly, and is actually them" \
              "- the phone number dials correctly" \
              "" \
              "Everything under \`docs/\` is generated. Do not hand-edit it." \
              > /tmp/pr-body.md
            url=$(gh pr create --head "$branch" --base main \
              --title "${MODE^} signature for ${NAME}" \
              --body-file /tmp/pr-body.md)
            echo "Opened $url"
            echo "pr=$url" >> "$GITHUB_OUTPUT"
          fi

      - name: Tell them
        if: always()
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          RESULT: ${{ job.status }}
          PR: ${{ steps.pr.outputs.pr }}
          ERR: ${{ steps.record.outputs.error }}
        with:
          script: |
            const ok = process.env.RESULT === 'success';
            const body = ok
              ? `Thanks - this is now a pull request: ${process.env.PR}\n\n`
                + 'It gets checked automatically, then a maintainer merges it. '
                + 'Your page appears on the site a minute or two after that, '
                + 'and you will be able to open it and press **Verify & copy**.'
              : 'I could not build a record from this request.\n\n```\n'
                + (process.env.ERR || 'See the workflow run for details.')
                + '\n```\n\nEdit the issue and it will try again.';
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body,
            });
