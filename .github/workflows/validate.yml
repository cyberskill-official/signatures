name: Validate

# Runs on every pull request. Contributors do not need Python, a browser, or
# any local setup - this is where the build and the render checks happen.
#
# docs/ is generated. A pull request that does not touch it is fine: publish.yml
# rebuilds and commits after merge. A pull request that DOES touch it must match
# a clean build exactly, which is how a hand-edit gets caught.

on:
  pull_request:
    branches: [main]

# contents: write is only used to push screenshots to the orphan `previews`
# branch, and it is safe here even though this workflow runs code from the
# pull request: `pull_request` (not `pull_request_target`) hands a fork a
# read-only token regardless of what this block says, and a same-repo branch
# could only have been pushed by someone who already had write access. The
# preview steps below are additionally guarded on same-repo so the fork case
# skips quietly instead of failing.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: pip install -r requirements.txt

      # Runs before the browser install so a bad record fails in seconds
      # rather than after a two-minute download. Covers the record schema and
      # every injection payload that once reached the published page.
      - name: Unit tests
        run: python3 -m pytest tests/ -q

      # Three engines, because email is not one renderer. WebKit is Apple Mail
      # on macOS and iOS and every iOS browser; Gecko is Thunderbird; Blink is
      # Chrome, Edge, Android WebViews and the web clients.
      - name: Cache browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-3-${{ runner.os }}-${{ hashFiles('.github/workflows/validate.yml') }}

      - name: Install browsers
        run: python -m playwright install --with-deps chromium firefox webkit

      - name: Did this pull request touch docs/
        id: touched
        run: |
          changed=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- docs/ | wc -l)
          echo "docs_changed=$changed" >> "$GITHUB_OUTPUT"
          if [ "$changed" -gt 0 ]; then
            echo "This pull request modifies $changed file(s) under docs/."
            echo "They must match a clean build exactly."
          else
            echo "docs/ untouched - it will be rebuilt automatically after merge."
          fi

      # --skip-icons because icon rasterisation goes through a headless browser
      # and is not guaranteed byte-identical across browser versions. Rebuilding
      # them here would produce a spurious diff on every unrelated change.
      # Avatars still rebuild - they go through Pillow and are deterministic.
      - name: Build and check
        run: ./install.sh --skip-icons

      - name: Generated output matches source
        if: steps.touched.outputs.docs_changed != '0'
        run: |
          if ! git diff --quiet -- docs/; then
            echo "::error::docs/ does not match a clean build."
            echo ""
            echo "Everything under docs/ is generated from src/ and build/."
            echo "Either revert your docs/ changes and let CI rebuild after"
            echo "merge, or run ./install.sh locally and commit the result."
            echo ""
            git diff --stat -- docs/
            exit 1
          fi
          echo "docs/ matches the build."

      - name: Render and accessibility checks
        run: python3 validation/check.py

      # --require-engines makes a missing engine a failure. Without it a broken
      # WebKit install would silently drop Apple Mail from the matrix and the
      # run would still go green.
      - name: Cross-client compatibility
        run: |
          python3 validation/crossclient.py \
            --engines chromium,firefox,webkit \
            --require-engines chromium,firefox,webkit

      - name: Collect results
        if: always()
        id: summary
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, glob
          lines = []
          try:
              m = json.load(open("build/manifest.json"))
              for p in m["people"]:
                  pct = p["chars"] / 100
                  flag = " **OVER LIMIT**" if p["over_limit"] else ""
                  lines.append(
                      f"| `{p['id']}` | {p['name']} | {p['role']} | "
                      f"{p['chars']} ({pct:.0f}% of Gmail limit){flag} |")
          except Exception as e:
              lines.append(f"| - | could not read manifest: {e} | | |")
          body = "\n".join(lines)
          print(f"table<<EOF\n{body}\nEOF")
          PY

      # Reviewers should not have to download a zip to see a signature. This
      # picks the affected people, copies three views each into a staging
      # directory, and writes the markdown that will embed them.
      - name: Build the preview strip
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        id: previews
        continue-on-error: true
        run: |
          rm -rf /tmp/pv && mkdir -p /tmp/pv
          python3 .github/scripts/pr_previews.py \
            --base-ref "$BASE_REF" --repo "$GITHUB_REPOSITORY" \
            --pr "$PR_NUMBER" --sha "$HEAD_SHA" \
            --stage /tmp/pv --out /tmp/previews.md
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      # A fresh orphan branch on first run, otherwise a commit on top. The
      # path already carries the head SHA, so an old image is never overwritten
      # and camo never serves a stale one.
      - name: Publish the preview images
        if: always() && steps.previews.outputs.staged > 0
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          d=$(mktemp -d); cd "$d"
          git init -q
          git remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git fetch -q --depth 1 origin previews 2>/dev/null; then
            git checkout -q FETCH_HEAD && git checkout -q -B previews
          else
            git checkout -q --orphan previews
            printf '%s\n' \
              "Screenshots embedded in pull request comments." "" \
              "Generated by .github/workflows/validate.yml. Nothing here is" \
              "source, and nothing here is deployed. Safe to delete - the next" \
              "pull request rebuilds it." > README.md
          fi

          cp -r /tmp/pv/. .
          git add -A
          git commit -q -m "Previews for #${PR_NUMBER} at ${HEAD_SHA:0:12}" \
            || { echo "identical to what is already published"; exit 0; }
          git push -q origin previews

      - name: Comment on the pull request
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7
        # Passed through env, never interpolated into the script body. The
        # table contains backticks, which would terminate a JS template
        # literal, and a branch or record could otherwise inject script.
        env:
          TABLE: ${{ steps.summary.outputs.table }}
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const fs = require('fs');
            const ok = process.env.JOB_STATUS === 'success';

            // Read from disk rather than an env var: the markdown is built by
            // a script, contains backticks and angle brackets, and must never
            // be interpolated into this script body.
            let previews = '';
            try { previews = fs.readFileSync('/tmp/previews.md', 'utf8'); }
            catch (e) { previews = '_Previews were not generated for this run._'; }

            const body = [
              '<!-- signature-check -->',
              ok ? '### All checks passed' : '### Checks failed',
              '',
              '| id | name | role | signature size |',
              '|---|---|---|---|',
              process.env.TABLE || '| - | no manifest produced | | |',
              '',
              '### What it looks like',
              '',
              previews,
              '',
              ok
                ? 'Once this merges, the site rebuilds and deploys automatically. Your page '
                  + 'will be at https://signatures.cyberskill.world/people/<id>/ within a '
                  + 'minute or two - open it and press **Verify and copy**.'
                : 'Open the failed step above to see what went wrong. Nothing reaches the live '
                  + 'site until this passes and a maintainer merges.',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const mine = comments.find(c => c.body.includes('<!-- signature-check -->'));
            if (mine) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: mine.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: render-evidence
          path: |
            validation/screenshots/
            validation/report.json
            validation/crossclient/
          if-no-files-found: warn
          retention-days: 14
