# --- signature styles ----------------------------------------------
# Ten kieu giu nguyen tieng Anh: do la ten cua kieu, va trang tro
# giup bao nguoi dung bam dung ten do trong ca hai ngon ngu.

style:
  classic:
    label: "Classic"
    note: "Ảnh bên trái, đường kẻ vàng đất. Kiểu mặc định."
  plate:
    label: "Plate"
    note: "Tên chữ trắng trên khối màu nâu."
  cap:
    label: "Cap"
    note: "Tên công ty ở trên, bạn ở dưới."
  footer:
    label: "Footer"
    note: "Dải màu thương hiệu chạy dọc phía dưới."
  sidebar:
    label: "Sidebar"
    note: "Ảnh và logo xếp chồng trong cột màu."
  compact:
    label: "Compact"
    note: "Khối nhỏ nhất mà vẫn đủ thông tin."
  stacked:
    label: "Stacked"
    note: "Không có ảnh. Logo dẫn đầu."
  split:
    label: "Split"
    note: "Bạn bên trái, cách liên hệ bên phải."
  banner:
    label: "Banner"
    note: "Kẻ trên kẻ dưới, như một tấm danh thiếp in."
  badge:
    label: "Badge"
    note: "Logo trong ô vuông màu. Không có ảnh."
