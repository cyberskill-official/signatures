# Vietnamese strings.
#
# DRAFT - needs a native speaker to read it before it is trusted. It was
# written to sound like a colleague explaining something, not like a
# translated manual, so the wording is not always literal.
#
# Deliberately left in English:
#   - GitHub, Gmail, Outlook, pull request, repository, pixel, clipboard.
#     These are the words Vietnamese developers actually use.
#   - "Verify & copy". It is the label printed on the button on the person
#     page, which is not translated, so translating the instruction would
#     tell people to press something that does not exist.

meta:
  name: Tiếng Việt
  html_lang: vi
  switch_to: English

chrome:
  skip: Đến nội dung chính
  nav_all: Tất cả chữ ký
  nav_help: Đăng ký hoặc cập nhật
  theme_dark: Tối
  theme_light: Sáng
  theme_to_dark: Chuyển sang giao diện tối
  theme_to_light: Chuyển sang giao diện sáng
